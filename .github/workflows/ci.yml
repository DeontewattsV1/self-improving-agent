name: Self-Improving Agent CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    name: Validate Agent Structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate SKILL.md
        run: |
          if [ -f SKILL.md ]; then
            echo "SKILL.md found"
            cat SKILL.md | head -5
          fi
      - name: Check learnings structure
        run: |
          for f in .learnings/ERRORS.md .learnings/LEARNINGS.md .learnings/FEATURE_REQUESTS.md; do
            if [ -f "$f" ]; then echo "OK: $f"; else echo "MISSING: $f"; exit 1; fi
          done
      - name: Validate hooks
        run: |
          node --version
          if [ -f hooks/openclaw/handler.js ]; then
            node -e "require('./hooks/openclaw/handler.js')" 2>/dev/null && echo "handler.js valid" || echo "handler.js: no default export (ok)"
          fi
      - name: Check scripts are executable
        run: |
          for s in scripts/*.sh; do
            echo "Found: $s"
            bash -n "$s" && echo "  Syntax OK" || echo "  Syntax error"
          done